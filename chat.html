<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat - LexScope Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <div class="hero-title-row">
          <div class="hero-icon"></div>
          <h1>LexScope Atlas</h1>
          <button class="theme-toggle" id="themeToggle" type="button" title="Toggle dark mode"></button>
        </div>
        <p class="sub">AI Regulatory Assistant &mdash; Multi-provider AI chat.</p>
      </section>

      <div class="page-card" id="chatContainer">
        <h2>Regulatory AI Chat</h2>
        <div class="chat-fullpage">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-msg system">Ask questions about your regulatory evaluation results. This is not legal advice.</div>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Ask about regulations, compliance requirements..." />
            <button id="chatSendBtn" type="button">Send</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
      <div class="footer-credit">Created by Tarun Agarwal</div>
    </main>

    <script type="module">
      import { initPage, getStoredResults, getStoredProfile, showToast, callAIChat } from "./shared.js";

      initPage("chat");

      let chatHistory = [];

      // Build system context from stored evaluation
      function buildSystemContext() {
        let sysContext = "You are a helpful regulatory compliance assistant for LexScope Atlas. Provide concise, factual answers. Always remind users this is not legal advice.";
        const profile = getStoredProfile();
        const results = getStoredResults();
        if (profile) sysContext += `\n\nCurrent company profile: ${JSON.stringify(profile)}`;
        if (results) {
          const applicable = results.filter(r => r.applicable).map(r => `${r.code}: ${r.name} (confidence: ${Math.round(r.confidence * 100)}%)`);
          sysContext += `\n\nApplicable regulations:\n${applicable.join("\n")}`;
        }
        return sysContext;
      }

      async function sendMessage() {
        const input = document.getElementById("chatInput");
        const msg = input.value.trim();
        if (!msg) return;
        input.value = "";

        const messagesEl = document.getElementById("chatMessages");
        messagesEl.insertAdjacentHTML("beforeend", `<div class="chat-msg user">${escapeHtml(msg)}</div>`);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        chatHistory.push({ role: "user", content: msg });

        const messages = [
          { role: "user", content: buildSystemContext() },
          { role: "assistant", content: "Understood. I'll help with regulatory questions based on this profile and evaluation. How can I help?" },
          ...chatHistory
        ];

        messagesEl.insertAdjacentHTML("beforeend", `<div class="chat-msg bot" id="chatTyping">Thinking...</div>`);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        try {
          const reply = await callAIChat(messages);
          chatHistory.push({ role: "assistant", content: reply });
          const typing = document.getElementById("chatTyping");
          if (typing) typing.outerHTML = `<div class="chat-msg bot">${formatReply(reply)}</div>`;
        } catch (err) {
          const typing = document.getElementById("chatTyping");
          if (err.message === "NO_KEY") {
            if (typing) typing.outerHTML = `<div class="chat-msg system">AI key required. <a href="settings.html">Open Settings</a> to add one.</div>`;
          } else {
            if (typing) typing.outerHTML = `<div class="chat-msg system">Error: ${err.message}</div>`;
          }
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function formatReply(text) {
        return escapeHtml(text).replace(/\n/g, "<br>");
      }

      document.getElementById("chatSendBtn").addEventListener("click", sendMessage);
      document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
  </body>
</html>
